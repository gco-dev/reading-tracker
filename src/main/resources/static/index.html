<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex-Libris | Personal Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <!-- Theme Toggle Button -->
        <button type="button" id="btn-theme-toggle" class="btn-theme" aria-label="Toggle theme" title="Switch to Dark Mode">
            🌙
        </button>
        <h1>Ex-Libris</h1>
        <p class="subtitle">Your personal literary collection</p>
        <div class="header-actions">
            <button type="button" id="btn-add-book" class="btn-primary">Add Book</button>
            <button type="button" id="btn-manage-authors" class="btn-secondary">Manage Authors</button>
            <button type="button" id="btn-sort" class="btn-secondary">Sort: A-Z</button>
            <button type="button" id="btn-reset" class="btn-reset">Reset Data</button>
        </div>
    </header>

    <main>
        <section class="library-section">
            <h2>My Book List <span id="book-counter" class="book-counter"></span></h2>
            <div id="book-list" class="book-grid"></div>
        </section>
    </main>

    <!-- ================= MODALS ================= -->

    <!-- 1. Author Create/Edit Modal -->
    <dialog id="modal-author" class="custom-modal large-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-author-title">Manage Authors</h3>
                <button type="button" class="btn-close-modal" aria-label="Close modal">×</button>
            </div>
            <div class="modal-body">
                <form id="form-author">
                    <input type="hidden" id="author-id" name="authorId">

                    <div class="form-group">
                        <label for="author-name">Author Name</label>
                        <input type="text" id="author-name" name="name" required placeholder="Author Name">
                        <span class="field-error" data-error-for="authorName"></span>
                    </div>

                    <div class="form-group">
                        <label for="author-country-id">Country</label>
                        <select id="author-country-id" name="countryId" required>
                            <option value="">Select Country...</option>
                        </select>
                        <span class="field-error" data-error-for="countryId"></span>
                    </div>

                    <div class="inline-group">
                        <button type="submit" id="btn-save-author" class="btn-primary">Save Author</button>
                        <button type="button" id="btn-cancel-author-edit" class="btn-secondary">Cancel</button>
                    </div>
                </form>

                <hr>

                <div class="table-container">
                    <table class="data-table" id="author-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Country</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </dialog>

    <!-- 2. Book Create/Edit Modal -->
    <dialog id="modal-book" class="custom-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-book-header">Add Book</h3>
                <button type="button" class="btn-close-modal" aria-label="Close modal">×</button>
            </div>
            <div class="modal-body">
                <form id="form-book">
                    <input type="hidden" id="book-id" name="bookId">

                    <div class="form-group">
                        <label for="book-title">Book Title</label>
                        <input type="text" id="book-title" name="title" required placeholder="Book Title">
                        <span class="field-error" data-error-for="title"></span>
                    </div>

                    <div class="form-group">
                        <label for="book-year">Publication Year</label>
                        <input type="number" id="book-year" name="publicationYear" min="-5000" max="2027" required placeholder="Publication Year (e.g. 1965 or -500 for 500 BC)">
                        <span class="field-error" data-error-for="publicationYear"></span>
                    </div>

                    <div class="form-group">
                        <label for="book-authors">Authors</label>
                        <select id="book-authors" name="authorIds" multiple required size="4"></select>
                        <small class="form-hint">Hold Ctrl/Cmd to select multiple</small>
                        <span class="field-error" data-error-for="authorIds"></span>
                    </div>

                    <div class="form-group">
                        <label for="book-themes">Themes</label>
                        <select id="book-themes" name="themeIds" multiple required size="4"></select>
                        <small class="form-hint">Hold Ctrl/Cmd to select multiple</small>
                        <span class="field-error" data-error-for="themeIds"></span>
                    </div>

                    <div class="form-group">
                        <label for="book-status">Initial Reading Status</label>
                        <select id="book-status" name="status">
                            <option value="UNREAD">Unread</option>
                            <option value="READ">Read</option>
                            <option value="PAUSED">Paused</option>
                            <option value="WANT_TO_READ">Want to Read</option>
                        </select>
                        <span class="field-error" data-error-for="status"></span>
                    </div>

                    <div class="inline-group">
                        <div class="form-group">
                            <label for="book-year-read">Initial Year Read</label>
                            <input type="number" id="book-year-read" name="yearRead" min="-5000" max="2027" placeholder="e.g. 2026">
                            <span class="field-error" data-error-for="yearRead"></span>
                        </div>

                        <div class="form-group">
                            <label for="book-grade">Initial Grade (0 - 10)</label>
                            <input type="number" id="book-grade" name="grade" min="0" max="10" step="0.1" placeholder="e.g. 8.5">
                            <span class="field-error" data-error-for="grade"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="book-priority">Priority (1 - 5)</label>
                        <input type="number" id="book-priority" name="priority" min="1" max="5" placeholder="1 (Lowest) to 5 (Highest)">
                        <span class="field-error" data-error-for="priority"></span>
                    </div>

                    <div class="inline-group">
                        <button type="submit" id="btn-save-book" class="btn-primary">Save Book</button>
                        <button type="button" class="btn-secondary btn-close-modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </dialog>

    <!-- 3. Reading Modal -->
    <dialog id="modal-reading" class="reading-modal custom-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-reading-book-title">Book Readings</h3>
                <button type="button" id="btn-close-modal-readings" class="btn-close-modal" aria-label="Close modal">×</button>
            </div>
            <div class="modal-body">
                <h4>Reading History</h4>
                <div id="modal-readings-list" class="readings-history-list"></div>

                <hr>

                <h4 id="modal-reading-form-title">Log Reading</h4>
                <form id="form-reading">
                    <input type="hidden" id="reading-book-id" name="bookId">
                    <input type="hidden" id="reading-id" name="readingId">

                    <div class="form-group">
                        <label for="reading-status">Reading Status</label>
                        <select id="reading-status" name="status">
                            <option value="UNREAD">Unread</option>
                            <option value="READ">Read</option>
                            <option value="PAUSED">Paused</option>
                            <option value="WANT_TO_READ">Want to Read</option>
                        </select>
                        <span class="field-error" data-error-for="status"></span>
                    </div>

                    <div class="inline-group">
                        <div class="form-group">
                            <label for="reading-year">Year Read</label>
                            <input type="number" id="reading-year" name="yearRead" min="-5000" max="2027" placeholder="e.g. 2026">
                            <span class="field-error" data-error-for="yearRead"></span>
                        </div>

                        <div class="form-group">
                            <label for="reading-grade">Grade (0 - 10)</label>
                            <input type="number" id="reading-grade" name="grade" min="0" max="10" step="0.1" placeholder="e.g. 9.0">
                            <span class="field-error" data-error-for="grade"></span>
                        </div>
                    </div>

                    <div class="inline-group">
                        <button type="submit" id="btn-save-reading" class="btn-primary">Save Reading</button>
                        <button type="button" id="btn-cancel-reading-edit" class="btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </dialog>

    <!-- Scripts (ES Modules) -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
