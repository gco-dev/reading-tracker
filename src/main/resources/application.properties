properties

# Habilita o H2 Console na web

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fixa a URL do banco em memória para não mudar o hash a cada restart

spring.datasource.url=jdbc:h2:mem:readingtrackerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Reiniciar a Aplicação

No terminal do VS Code onde o Spring Boot está rodando:
1. Pressione 'Ctrl + C' para parar a aplicação.
2. Execute novamente:
bash
.\mvnw spring-boot:run