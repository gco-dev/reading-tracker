\# Nome da aplicação e porta do servidor spring.application.name=reading-tracker server.port=8080

\# Configuração do Banco de Dados H2 (Salva os dados em arquivo local na pasta ./data/readingtracker) spring.datasource.url=jdbc:h2:file:./data/readingtracker;DB\_CLOSE\_DELAY=-1;DB\_CLOSE\_ON\_EXIT=FALSE spring.datasource.driverClassName=org.h2.Driver spring.datasource.username=sa spring.datasource.password=

\# Habilitar o Painel Visual do H2 no navegador (http://localhost:8080/h2-console) spring.h2.console.enabled=true spring.h2.console.path=/h2-console

\# Configurações do JPA (Cria e atualiza as tabelas do banco automaticamente) spring.jpa.hibernate.ddl-auto=update spring.jpa.show-sql=true spring.jpa.properties.hibernate.format\_sql=true
