<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex-Libris | Acervo Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Seja muito bem-vindo(a) ao Ex-Libris</h1>
        <p class="subtitulo">Seu acervo literário pessoal</p>
    </header>
    
    <main>
        <section class="adicionar-livro">
            <h2>Adicionar Novo Livro</h2>
            <form id="form-novo-livro">
                <input type="text" id="novo-titulo" placeholder="Título do Livro" required>
                <input type="number" id="novo-ano" min="-4000" placeholder="Ex: 2024 ou -500">
                
                <select id="novo-autor">
                    <option value="">Selecione o Autor...</option>
                </select>

                <input type="text" id="autor-digitado" placeholder="Ou digite um novo autor">

                <select id="novo-formato">
                    <option value="">Selecione o Formato...</option>
                    <option value="Físico">Físico</option>
                    <option value="E-book">E-book</option>
                    <option value="Audiobook">Audiobook</option>
                </select>

                <select id="novo-status" required>
                    <option value="">Status de Leitura...</option>
                    <option value="Quero ler">Quero ler</option>
                    <option value="Lendo">Lendo</option>
                    <option value="Lido">Lido</option>
                    <option value="Abandonado">Abandonado</option>
                </select>

                <button type="submit">Salvar Livro</button>
            </form>
        </section>

        <hr>

        <h2>Minha Lista de Livros</h2>
        <div id="lista-livros" class="grid-livros"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
